<!DOCTYPE html>
<html>
    <head>
        <title>Ejercicio5</title>
    </head>
<body>
<script languaje="JavaScript">
    var x, y;
    x = parseFloat(prompt("Introduzca la coordenada x: "));
    y = parseFloat(prompt("Introduzca la coordenada y: "));

    if (x > 0 && y > 0) {
        alert("Estamos en el primer cuadrante");
    }
    else if (x < 0 && y > 0) {
        alert("Estamos en el segundo cuadrante")
    }
    if (x < 0 && y < 0) {
        alert("Estamos en el tercer cuadrante");
    }
    else if (x > 0 && y < 0) {
        alert("Estamos en el cuarto cuadrante");
    }
    if (x == 0 && y == 0) {
        alert("Estamos en el eje de ordenadas");
    }
</script>
</body>
</html>
