<script languaje="JavaScript">
    //Ejercicio que suma los numero si son iguales.
    var num1, num2, num3;
    num1 = parseFloat(prompt("Introduzca el primero numero (Tiene que ser los 3 iguales):"));
    num2 = parseFloat(prompt("Introduzca el segundo numero:"));
    num3 = parseFloat(prompt("Introduzca el tercer numero:"));

    if (num1 == num2 && num2 == num3 && num3 == num1) {
        alert((num1 + num2)*num3);
    } 
    else {
        alert("Los numeros no son iguales, por tanto no se hace la suma");
    }
</script>
