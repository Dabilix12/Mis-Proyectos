<body>
<script languaje="JavaScript">
    //Ejercicio que revisa si todos los numero introducios son iguales o mayores que diez
    var num1, num2, num3;
    num1 = parseFloat(prompt("Introduzca el primero numero (Tienen que ser los 3 menos o iguales a 10):"));
    num2 = parseFloat(prompt("Introduzca el segundo numero:"));
    num3 = parseFloat(prompt("Introduzca el tercer numero:"));

    if (num1 <= 10 && num2 <= 10 && num3 <= 10) {
        alert("Todos los numeros son menores de diez");
    } else{
        alert("Todos o algunos de los numeros introducidos no son mayores que diez")
    }
</script>
